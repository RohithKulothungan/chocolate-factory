name: Frost Bomb pre-order
description: Log a pre-order interest for Posh Fair 2026
title: "Pre-order: "
labels:
  - pre-order
body:
  - type: input
    id: name
    attributes:
      label: Name
      description: Who should we look for at the stall?
    validations:
      required: true
  - type: input
    id: contact
    attributes:
      label: Email or phone
      description: Optional — so we can reach you on fair day
  - type: dropdown
    id: flavour
    attributes:
      label: Flavour
      options:
        - Dark Chocolate Orange Frost Bomb
        - Milk Chocolate Mixed Nuts Frost Bomb
        - Mini Dark Chocolate Peanut Butter
        - Mini Milk Chocolate Frost Bomb
        - Mini Dark Chocolate Jam
        - Caramelized Pineapple Milk Chocolate
    validations:
      required: true
  - type: input
    id: quantity
    attributes:
      label: Quantity
      description: How many would you like?
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Allergies, pickup time, or anything else
